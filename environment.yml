# Portable environment spec. Only the packages actually needed directly are
# version-pinned: python, samtools, openjdk, pip, sra-tools (bumped from
# the dev environment's 2.9.6 -- see note below), plus every package in the
# pip: section (PyPI wheels are properly platform-tagged, so exact pins
# there are safe across platforms).
#
# Everything else below is a transitive C-library dependency (of openjdk's
# GUI/font stack, of samtools/htslib, or of gettext/glib) that conda's
# export pulled in as part of the installed closure, not something this
# project calls directly. These are left UNPINNED on purpose: hard-pinning
# them to the exact versions solved for linux-64 repeatedly produced
# real cross-platform conflicts on macOS during testing --
#   - alsa-lib, libgcc-ng, libstdcxx-ng, _libgcc_mutex, _openmp_mutex,
#     keyutils, libcups, libnsl, libstdcxx: no macOS build exists at all
#     for these package names.
#   - libxml2=2.15.3 pinned exactly conflicted with sra-tools' own
#     transitive requirement (via perl-xml-libxml) for libxml2 <2.15 on
#     macOS -- two explicit exact pins that can't both hold at once.
# Leaving them unpinned lets each platform's solver pick its own mutually
# consistent set, which is what actually solves. If you need to reproduce
# an exact transitive-library version for debugging, cross-check
# environment-linux64-exact.yml.
#
# sra-tools: bumped 2.9.6 -> 3.4.1. bioconda never built 2.9.6 (2018) for
# any macOS arch (oldest osx-64 build is 3.1.1; osx-arm64 only has
# 3.2.1/3.4.1). Nothing in this repo currently calls sra-tools directly,
# so the bump carries no known behavioural risk today -- but note it if
# you add code that depends on its exact CLI behaviour.
#
# Verified with `conda create --dry-run` against the real conda-forge/
# bioconda/defaults indices (not just channeldata.json) under
# CONDA_SUBDIR=osx-arm64, osx-64, and linux-64 -- osx runs also needed
# CONDA_OVERRIDE_OSX set, since a Linux host has no macOS version of its
# own to check the packages' __osx constraints against. All three solved
# cleanly (exit 0, no unsatisfiable/not-found errors), with python,
# samtools, sra-tools, and openjdk all resolving at the exact pinned
# versions on every platform. This is not the same as an actual install
# on macOS hardware, since none was available here.
# Windows is NOT supported at any pin: bioconda doesn't publish win-64
# builds of samtools/htslib/sra-tools.
#
# For an exact reproduction of the linux-64 development environment (down
# to the conda build hash), use environment-linux64-exact.yml instead.
#
# IGV itself (the desktop app used for screenshots) is not a conda
# package and is not included here -- see scripts/install_igv.sh.
